[project]
name = "aharya"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
